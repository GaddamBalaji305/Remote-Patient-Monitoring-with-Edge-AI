version: '3.8'

services:
  # 1. PostgreSQL Database Service
  database:
    image: postgres:15-alpine
    container_name: rpm_database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpm_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-rpm_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpm_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rpm_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./rpm_edge_ai.db}
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Edge AI Sensor & Model Pipeline Service
  edge-ai:
    build:
      context: .
      dockerfile: edge_ai/Dockerfile
    container_name: rpm_edge_ai
    restart: always
    environment:
      BACKEND_URL: http://backend:8000/api/edge/events
    depends_on:
      backend:
        condition: service_healthy

  # 4. Frontend Nginx React SPA Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rpm_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
