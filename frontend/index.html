<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPM Edge AI - Clinical Telemetry Station</title>
  
  <!-- Google Fonts & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Recharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.0/umd/Recharts.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#164e63',
            },
            status: {
              normal: '#10b981',
              warning: '#f59e0b',
              critical: '#ef4444',
              offline: '#6b7280'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-primary: #090d16;
      --bg-card: rgba(17, 24, 39, 0.85);
      --border-color: rgba(55, 65, 81, 0.5);
      --border-highlight: rgba(6, 182, 212, 0.4);
    }
    body {
      background-color: var(--bg-primary);
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .glass-panel:hover {
      border-color: var(--border-highlight);
    }
    .oscilloscope-box {
      background-color: #04070d;
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 10px rgba(6, 182, 212, 0.15);
    }
    .oscilloscope-box::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(6, 182, 212, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.07) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }
    .badge-normal { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-info { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-critical { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5); animation: pulse-critical 1.5s infinite; }
    .badge-offline { background: rgba(107, 114, 128, 0.2); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.4); }

    @keyframes pulse-critical {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 14px 4px rgba(239, 68, 68, 0.6); }
    }
    .mono-val { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#090d16] text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- RECHARTS COMPONENTS ---
    const RechartsObj = window.Recharts || {};
    const { ResponsiveContainer, LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, Legend } = RechartsObj;

    // --- API & WEBSOCKET BASE CONFIG ---
    const API_BASE = (window.location.origin.includes("3000") || window.location.origin.includes("5173") || window.location.origin.includes("vercel.app"))
      ? "http://127.0.0.1:8000/api"
      : `${window.location.origin}/api`;

    const WS_BASE = (window.location.origin.includes("3000") || window.location.origin.includes("5173") || window.location.origin.includes("vercel.app"))
      ? "ws://127.0.0.1:8000/ws/monitoring"
      : window.location.origin.replace(/^http/, 'ws') + "/ws/monitoring";


    // --- ECG CANVAS OSCILLOSCOPE ---
    function ECGCanvas({ status = "NORMAL", height = 80, label = "ECG Lead II (mV)" }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let t = 0;
        const buffer = new Array(250).fill(0);

        const render = () => {
          t += 0.05;
          const isCrit = status === "CRITICAL";
          const isWarn = status === "WARNING";
          const isOff = status === "OFFLINE";
          const hr = isCrit ? 135 : (isWarn ? 105 : (isOff ? 0 : 74));
          const color = isCrit ? "#ef4444" : (isWarn ? "#f59e0b" : (isOff ? "#6b7280" : "#10b981"));

          let val = 0;
          if (isOff) {
            val = (Math.random() - 0.5) * 0.02;
          } else {
            const freq = hr / 60.0;
            const phase = (t * freq) % 1.0;
            const p = 0.15 * Math.exp(-Math.pow((phase - 0.12) / 0.03, 2));
            const q = -0.15 * Math.exp(-Math.pow((phase - 0.22) / 0.01, 2));
            const r_h = isCrit ? 1.6 : 1.2;
            const r = r_h * Math.exp(-Math.pow((phase - 0.25) / 0.012, 2));
            const s = -0.35 * Math.exp(-Math.pow((phase - 0.28) / 0.015, 2));
            const t_w = 0.3 * Math.exp(-Math.pow((phase - 0.45) / 0.05, 2));
            val = p + q + r + s + t_w + (Math.random() - 0.5) * 0.03;
          }

          buffer.push(val);
          if (buffer.length > 250) buffer.shift();

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          ctx.beginPath();
          ctx.lineWidth = 2.0;
          ctx.strokeStyle = color;
          ctx.shadowBlur = 6;
          ctx.shadowColor = color;
          const step = canvas.width / (buffer.length - 1);
          const centerY = canvas.height / 2;

          for (let i = 0; i < buffer.length; i++) {
            const x = i * step;
            const y = centerY - (buffer[i] * canvas.height * 0.35);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.shadowBlur = 0;

          const lastX = (buffer.length - 1) * step;
          const lastY = centerY - (buffer[buffer.length - 1] * canvas.height * 0.35);
          ctx.beginPath();
          ctx.arc(lastX, lastY, 3.0, 0, 2 * Math.PI);
          ctx.fillStyle = "#ffffff";
          ctx.fill();

          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [status]);

      return (
        <div className="oscilloscope-box" style={{ width: '100%', height: `${height}px` }}>
          <div className="absolute top-1 left-2 text-[0.65rem] font-semibold text-cyan-400 z-10">
            {label}
          </div>
          <canvas ref={canvasRef} width={450} height={height} className="w-full h-full block" />
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [token, setToken] = useState(localStorage.getItem('access_token') || '');
      const [user, setUser] = useState(JSON.parse(localStorage.getItem('user_data') || 'null'));
      const [currentRoute, setCurrentRoute] = useState(window.location.hash ? window.location.hash.replace('#', '') : '/dashboard');
      
      const [stats, setStats] = useState({ total_patients: 0, active_monitoring: 0, warning: 0, critical: 0, offline: 0 });
      const [patients, setPatients] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [selectedPatientId, setSelectedPatientId] = useState(null);
      const [patientDetail, setPatientDetail] = useState(null);
      const [vitalsHistory, setVitalsHistory] = useState([]);
      const [timeRange, setTimeRange] = useState('1 hour');
      
      // STEP 13: PERFORMANCE METRICS
      const [metrics, setMetrics] = useState({
        model_version: "1.2.0-rf-edge",
        model_size_kb: 148.5,
        current_inference_latency_ms: 1.84,
        average_inference_latency_ms: 1.85,
        cpu_usage_percent: 4.2,
        memory_usage_mb: 48.5,
        processed_samples_count: 1250,
        connection_status: "ONLINE"
      });

      const [benchmark, setBenchmark] = useState(null);
      const [benchmarking, setBenchmarking] = useState(false);
      const [networkState, setNetworkState] = useState('ONLINE');
      const [wsConnected, setWsConnected] = useState(false);
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(false);

      // STEP 17: DEMO SIMULATION CONTROLLER STATES
      const [demoPatient, setDemoPatient] = useState('P001');
      const [demoScenario, setDemoScenario] = useState('LOW_SPO2');
      const [demoInterval, setDemoInterval] = useState(2.0);
      const [demoDuration, setDemoDuration] = useState(60);
      const [demoActive, setDemoActive] = useState(false);
      const [demoStatus, setDemoStatus] = useState(null);

      // Login form state
      const [loginEmail, setLoginEmail] = useState('doctor@example.com');
      const [loginPassword, setLoginPassword] = useState('Doctor123!');
      const [loginError, setLoginError] = useState('');

      // Patient Search & Filter
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [alertFilter, setAlertFilter] = useState('ALL');

      // Add Patient Modal States
      const [showAddPatientModal, setShowAddPatientModal] = useState(false);
      const [newPatientData, setNewPatientData] = useState({
        patient_code: 'PAT-006',
        name: '',
        age: 50,
        gender: 'Male',
        room: 'Ward 104',
        phone: '+1-555-0199',
        emergency_contact: '+1-555-9900'
      });

      const handleCreatePatient = async (e) => {
        if (e) e.preventDefault();
        try {
          const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          };
          const res = await fetch(`${API_BASE}/patients`, {
            method: 'POST',
            headers,
            body: JSON.stringify(newPatientData)
          });
          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || 'Failed to register patient');
          }
          const created = await res.json();
          setPatients(prev => [created, ...prev]);
          setStats(prev => ({ ...prev, total_patients: prev.total_patients + 1 }));
          setShowAddPatientModal(false);
          setToast({
            severity: 'NORMAL',
            alert_type: 'PATIENT_REGISTERED',
            message: `Patient ${created.name} (${created.patient_code}) successfully registered in telemetry system.`,
            patient_id: created.patient_code
          });
          setNewPatientData({
            patient_code: 'PAT-007',
            name: '',
            age: 50,
            gender: 'Male',
            room: 'Ward 104',
            phone: '+1-555-0199',
            emergency_contact: '+1-555-9900'
          });
        } catch (err) {
          alert(err.message);
        }
      };


      // Sync window hash location
      useEffect(() => {
        const handleHashChange = () => {
          const path = window.location.hash.replace('#', '') || '/dashboard';
          setCurrentRoute(path);
          if (path.startsWith('/patients/')) {
            const pid = path.replace('/patients/', '');
            setSelectedPatientId(pid);
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        handleHashChange();
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const navigate = (path) => {
        window.location.hash = path;
        setCurrentRoute(path);
      };

      // --- AUTHENTICATION ---
      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setLoginError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail, password: loginPassword })
          });
          if (!res.ok) throw new Error('Invalid email or password credentials');
          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('user_data', JSON.stringify(data.user));
          setToken(data.access_token);
          setUser(data.user);
          navigate('/dashboard');
        } catch (err) {
          setLoginError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('access_token');
        localStorage.removeItem('user_data');
        setToken('');
        setUser(null);
        navigate('/login');
      };

      // --- STEP 17: DEMO SIMULATION CONTROL HANDLERS ---
      const handleStartDemo = async () => {
        try {
          const res = await fetch(`${API_BASE}/demo/start`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({
              patient_id: demoPatient,
              scenario: demoScenario,
              interval_seconds: parseFloat(demoInterval),
              duration_seconds: parseFloat(demoDuration)
            })
          });
          if (res.ok) {
            setDemoActive(true);
            fetchDemoStatus();
          }
        } catch (err) {
          console.error("Start demo error:", err);
        }
      };

      const handleStopDemo = async () => {
        try {
          const res = await fetch(`${API_BASE}/demo/stop`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            setDemoActive(false);
            fetchDemoStatus();
          }
        } catch (err) {
          console.error("Stop demo error:", err);
        }
      };

      const fetchDemoStatus = async () => {
        try {
          const res = await fetch(`${API_BASE}/demo/status`);
          if (res.ok) {
            const data = await res.json();
            setDemoStatus(data);
            setDemoActive(data.active);
          }
        } catch (err) {}
      };

      useEffect(() => {
        fetchDemoStatus();
        const timer = setInterval(fetchDemoStatus, 3000);
        return () => clearInterval(timer);
      }, []);

      // --- FETCH DASHBOARD & PERFORMANCE METRICS DATA ---
      const fetchDashboardData = async () => {
        if (!token) return;
        try {
          const headers = { Authorization: `Bearer ${token}` };
          
          const resStats = await fetch(`${API_BASE}/dashboard/statistics`, { headers });
          if (resStats.ok) {
            setStats(await resStats.json());
            if (networkState === 'OFFLINE' || networkState === 'RECONNECTING') {
              setNetworkState('ONLINE');
            }
          }

          const resPatients = await fetch(`${API_BASE}/patients?limit=50`, { headers });
          if (resPatients.ok) {
            const pList = await resPatients.json();
            const fullList = await Promise.all(pList.map(async (p) => {
              const resDet = await fetch(`${API_BASE}/patients/${p.id}`, { headers });
              if (resDet.ok) return await resDet.json();
              return p;
            }));
            setPatients(fullList);
          }

          const resAlerts = await fetch(`${API_BASE}/alerts?limit=50`, { headers });
          if (resAlerts.ok) setAlerts(await resAlerts.json());

          const resMetrics = await fetch(`${API_BASE}/monitoring/metrics`, { headers });
          if (resMetrics.ok) setMetrics(await resMetrics.json());

        } catch (err) {
          console.error("Fetch dashboard data error:", err);
          setNetworkState('OFFLINE');
        }
      };

      useEffect(() => {
        if (token && currentRoute !== '/login') {
          fetchDashboardData();
          const timer = setInterval(fetchDashboardData, 5000);
          return () => clearInterval(timer);
        }
      }, [token, currentRoute]);

      // --- RUN CONTROLLED BENCHMARK ---
      const handleRunBenchmark = async () => {
        setBenchmarking(true);
        try {
          const res = await fetch(`${API_BASE}/monitoring/benchmark?iterations=10`);
          if (res.ok) {
            const bData = await res.json();
            setBenchmark(bData);
          }
        } catch (err) {
          console.error("Benchmark error:", err);
        } finally {
          setBenchmarking(false);
        }
      };

      useEffect(() => {
        if (currentRoute === '/monitoring' && !benchmark) {
          handleRunBenchmark();
        }
      }, [currentRoute]);

      // --- FETCH PATIENT DETAIL & VITALS HISTORY ---
      const fetchPatientDetailAndHistory = async () => {
        if (!selectedPatientId || !token) return;
        try {
          const headers = { Authorization: `Bearer ${token}` };
          
          const resDet = await fetch(`${API_BASE}/patients/${selectedPatientId}`, { headers });
          if (resDet.ok) {
            const det = await resDet.json();
            setPatientDetail(det);
          }

          const limitMap = { '1 hour': 30, '6 hours': 60, '24 hours': 120, '7 days': 250 };
          const limitVal = limitMap[timeRange] || 60;
          const resHist = await fetch(`${API_BASE}/patients/${selectedPatientId}/vitals?limit=${limitVal}`, { headers });
          if (resHist.ok) {
            const hData = await resHist.json();
            const formatted = hData.map(v => ({
              time: v.timestamp ? new Date(v.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '--',
              heart_rate: v.heart_rate,
              spo2: v.spo2,
              temperature: v.temperature,
              respiratory_rate: v.respiratory_rate,
              systolic_bp: v.systolic_bp,
              diastolic_bp: v.diastolic_bp
            }));
            setVitalsHistory(formatted);
          }
        } catch (err) {
          console.error("Fetch patient detail error:", err);
        }
      };

      useEffect(() => {
        if (selectedPatientId && currentRoute.startsWith('/patients/')) {
          fetchPatientDetailAndHistory();
        }
      }, [selectedPatientId, timeRange, token, currentRoute]);

      // --- REAL-TIME WEBSOCKET MONITORING SUBSCRIBER ---
      useEffect(() => {
        if (!token) return;
        let ws;
        try {
          ws = new WebSocket(WS_BASE);
          ws.onopen = () => {
            setWsConnected(true);
            setNetworkState('ONLINE');
          };
          ws.onclose = () => {
            setWsConnected(false);
            setNetworkState('RECONNECTING');
          };
          ws.onerror = () => {
            setWsConnected(false);
            setNetworkState('OFFLINE');
          };

          ws.onmessage = (event) => {
            const payload = JSON.parse(event.data);
            setNetworkState('ONLINE');

            setPatients(prev => prev.map(p => {
              if (p.patient_code === payload.patient_id || String(p.id) === String(payload.patient_id)) {
                return {
                  ...p,
                  status: payload.status,
                  latest_vitals: payload.vitals,
                  latest_prediction: {
                    prediction: payload.prediction.label,
                    risk_score: payload.prediction.risk_score,
                    confidence: payload.prediction.confidence
                  },
                  updated_at: payload.timestamp
                };
              }
              return p;
            }));

            if (patientDetail && (patientDetail.patient_code === payload.patient_id || String(patientDetail.id) === String(payload.patient_id))) {
              setPatientDetail(prev => ({
                ...prev,
                status: payload.status,
                latest_vitals: payload.vitals,
                latest_prediction: {
                  prediction: payload.prediction.label,
                  risk_score: payload.prediction.risk_score,
                  confidence: payload.prediction.confidence
                },
                updated_at: payload.timestamp
              }));

              const newPoint = {
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                heart_rate: payload.vitals.heart_rate,
                spo2: payload.vitals.spo2,
                temperature: payload.vitals.temperature,
                respiratory_rate: payload.vitals.respiratory_rate,
                systolic_bp: payload.vitals.systolic_bp || 120,
                diastolic_bp: payload.vitals.diastolic_bp || 80
              };
              setVitalsHistory(prev => [...prev.slice(-100), newPoint]);
            }

            if (payload.alert || payload.status === "CRITICAL" || payload.prediction.label !== "NORMAL") {
              const alertObj = payload.alert || {};
              setToast({
                patient_id: payload.patient_id,
                alert_type: alertObj.alert_type || payload.prediction.label,
                severity: alertObj.severity || payload.status,
                message: alertObj.message || `Patient ${payload.patient_id}: SpO₂ ${payload.vitals.spo2}%, HR ${payload.vitals.heart_rate} BPM | Prediction: ${payload.prediction.label}`,
                timestamp: payload.timestamp
              });
              setTimeout(() => setToast(null), 7000);
            }

            fetchDashboardData();
          };
        } catch (e) {
          setWsConnected(false);
          setNetworkState('OFFLINE');
        }

        return () => {
          if (ws) ws.close();
        };
      }, [token, patientDetail]);

      const handleAcknowledgeAlert = async (alertId) => {
        try {
          const res = await fetch(`${API_BASE}/alerts/${alertId}/acknowledge`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ acknowledged_by: user ? user.name : "Dr. On-Duty" })
          });
          if (res.ok) {
            const updatedAlert = await res.json();
            setAlerts(prev => prev.map(a => a.id === alertId ? updatedAlert : a));
          }
        } catch (err) {
          console.error("Acknowledge error:", err);
        }
      };

      const filteredPatients = patients.filter(p => {
        const matchesSearch = !searchQuery || 
          p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
          p.patient_code.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (p.room && p.room.toLowerCase().includes(searchQuery.toLowerCase()));
        
        const matchesStatus = statusFilter === 'ALL' || p.status.toUpperCase() === statusFilter;
        return matchesSearch && matchesStatus;
      });

      const filteredAlerts = alerts.filter(a => {
        if (alertFilter === 'ALL') return true;
        if (alertFilter === 'CRITICAL') return a.severity === 'CRITICAL';
        if (alertFilter === 'WARNING') return a.severity === 'WARNING';
        if (alertFilter === 'ACTIVE') return a.status === 'ACTIVE';
        if (alertFilter === 'ACKNOWLEDGED') return a.status === 'ACKNOWLEDGED';
        return true;
      });

      if (!token && currentRoute !== '/login') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="glass-panel p-8 max-w-md w-full text-center space-y-6">
              <div className="w-16 h-16 bg-cyan-500/20 border border-cyan-500/40 rounded-2xl flex items-center justify-center mx-auto text-cyan-400">
                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              </div>
              <h2 className="text-2xl font-bold text-white">Authentication Required</h2>
              <p className="text-sm text-gray-400">Please sign in to access the Clinical Telemetry Dashboard.</p>
              <button onClick={() => navigate('/login')} className="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-xl transition-all">
                Go to Login Page
              </button>
            </div>
          </div>
        );

                  </div>

                  <div className="glass-panel p-4 space-y-1 border-t-2 border-indigo-400">
                    <div className="text-[0.65rem] font-semibold text-indigo-400 uppercase">CPU Usage</div>
                    <div className="mono-val text-xl font-bold text-indigo-300">{metrics.cpu_usage_percent}%</div>
                    <div className="text-[0.65rem] text-gray-500">Core Process</div>
                  </div>

                  <div className="glass-panel p-4 space-y-1 border-t-2 border-purple-400">
                    <div className="text-[0.65rem] font-semibold text-purple-400 uppercase">RAM Footprint</div>
                    <div className="mono-val text-xl font-bold text-purple-300">{metrics.memory_usage_mb} <span className="text-xs text-gray-400">MB</span></div>
                    <div className="text-[0.65rem] text-gray-500">RSS Memory</div>
                  </div>

                  <div className="glass-panel p-4 space-y-1 border-t-2 border-amber-400">
                    <div className="text-[0.65rem] font-semibold text-amber-400 uppercase">Model Size</div>
                    <div className="mono-val text-xl font-bold text-amber-300">{metrics.model_size_kb} <span className="text-xs text-gray-400">KB</span></div>
                    <div className="text-[0.65rem] text-gray-500">Joblib File</div>
                  </div>

                  <div className="glass-panel p-4 space-y-1 border-t-2 border-cyan-500">
                    <div className="text-[0.65rem] font-semibold text-gray-400 uppercase">Samples Processed</div>
                    <div className="mono-val text-xl font-bold text-white">{metrics.processed_samples_count}</div>
                    <div className="text-[0.65rem] text-emerald-400 font-bold">{metrics.connection_status}</div>
                  </div>
                </div>

                {/* BENCHMARK COMPARISON TABLE */}
                <div className="glass-panel p-6 space-y-4 border-l-4 border-cyan-500">
                  <div className="flex items-center justify-between flex-wrap gap-4">
                    <div>
                      <h3 className="text-base font-bold text-white flex items-center gap-2">
                        <span>Controlled Empirical Benchmark: Edge vs Cloud</span>
                        <span className="text-xs font-mono font-normal text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">Measured Real Execution</span>
                      </h3>
                      <p className="text-xs text-gray-400">Timer measurements using Python time.perf_counter() comparing local in-memory inference vs HTTP REST round-trip</p>
                    </div>

                    <button 
                      onClick={handleRunBenchmark}
                      disabled={benchmarking}
                      className="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-xl text-xs shadow-lg shadow-cyan-500/20 transition-all flex items-center gap-1.5"
                    >
                      {benchmarking ? 'Executing Benchmark...' : 'Run Live Benchmark'}
                    </button>
                  </div>

                  {benchmark ? (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-900/90 p-5 rounded-xl border border-gray-800">
                      <div className="p-4 bg-slate-950/80 rounded-xl border border-emerald-500/30 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-emerald-400 uppercase">Local Edge AI Inference</span>
                          <span className="text-[0.65rem] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono font-bold">OPTIMAL</span>
                        </div>
                        <div className="text-3xl font-mono font-bold text-white">{benchmark.edge_local.avg_latency_ms} <span className="text-sm text-gray-400 font-normal">ms</span></div>
                        <div className="text-xs text-gray-300 space-y-1 pt-2 border-t border-gray-800">
                          <div><span className="text-gray-500">Network Payload:</span> <strong className="text-emerald-400 font-mono">0 Bytes / sample</strong></div>
                          <div><span className="text-gray-500">Data Privacy:</span> <strong className="text-gray-200">On-Device Local</strong></div>
                          <div><span className="text-gray-500">Offline Resilience:</span> <strong className="text-emerald-400">Full Offline Operation</strong></div>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-950/80 rounded-xl border border-amber-500/30 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-amber-400 uppercase">Cloud REST Round-Trip</span>
                          <span className="text-[0.65rem] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-mono font-bold">NETWORK OVERHEAD</span>
                        </div>
                        <div className="text-3xl font-mono font-bold text-white">{benchmark.cloud_remote.avg_latency_ms} <span className="text-sm text-gray-400 font-normal">ms</span></div>
                        <div className="text-xs text-gray-300 space-y-1 pt-2 border-t border-gray-800">
                          <div><span className="text-gray-500">Network Payload:</span> <strong className="text-amber-400 font-mono">{benchmark.cloud_remote.network_transfer_bytes_per_sample} Bytes / sample</strong></div>
                          <div><span className="text-gray-500">Data Privacy:</span> <strong className="text-gray-200">Transmitted over Network</strong></div>
                          <div><span className="text-gray-500">Offline Resilience:</span> <strong className="text-rose-400">Fails when Network Drops</strong></div>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-950/80 rounded-xl border border-cyan-500/30 space-y-2 flex flex-col justify-between">
                        <div>
                          <div className="text-xs font-bold text-cyan-400 uppercase">Performance Advantage</div>
                          <div className="text-3xl font-mono font-bold text-cyan-300 mt-1">{benchmark.performance_gain.speedup_factor}</div>
                          <div className="text-xs text-emerald-400 font-semibold mt-1">
                            {benchmark.performance_gain.latency_reduction_pct}% Latency Reduction
                          </div>
                        </div>
                        <div className="text-xs text-gray-300 pt-2 border-t border-gray-800">
                          <div><span className="text-gray-500">Bandwidth Saved:</span> <strong className="text-cyan-400 font-mono">{benchmark.performance_gain.bandwidth_saved_bytes_per_sample} B / reading</strong></div>
                          <div className="text-[0.7rem] text-gray-400 mt-1 italic">Sub-2ms edge processing enables instant clinical alert detection.</div>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="glass-panel p-8 text-center text-gray-400">Loading empirical benchmark measurements...</div>
                  )}
                </div>

                {/* 3 RECHARTS PERFORMANCE CHARTS */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  <div className="glass-panel p-5 space-y-3">
                    <div className="text-xs font-bold text-white uppercase tracking-wider">1. Inference Latency Comparison (ms)</div>
                    <div className="h-64 w-full bg-slate-950/60 p-3 rounded-xl border border-gray-800">
                      {ResponsiveContainer ? (
                        <ResponsiveContainer width="100%" height="100%">
                          <BarChart data={[
                            { name: 'Local Edge', ms: benchmark?.edge_local.avg_latency_ms || 1.85, fill: '#10b981' },
                            { name: 'Cloud REST', ms: benchmark?.cloud_remote.avg_latency_ms || 32.5, fill: '#f59e0b' }
                          ]}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                            <XAxis dataKey="name" stroke="#64748b" fontSize={11} />
                            <YAxis stroke="#64748b" fontSize={11} />
                            <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#fff', fontSize: '12px' }} />
                            <Bar dataKey="ms" name="Latency (ms)" radius={[6, 6, 0, 0]} />
                          </BarChart>
                        </ResponsiveContainer>
                      ) : null}
                    </div>
                  </div>

                  <div className="glass-panel p-5 space-y-3">
                    <div className="text-xs font-bold text-white uppercase tracking-wider">2. Network Payload (Bytes / Sample)</div>
                    <div className="h-64 w-full bg-slate-950/60 p-3 rounded-xl border border-gray-800">
                      {ResponsiveContainer ? (
                        <ResponsiveContainer width="100%" height="100%">
                          <BarChart data={[
                            { name: 'Local Edge', bytes: 0, fill: '#10b981' },
                            { name: 'Cloud REST', bytes: benchmark?.cloud_remote.network_transfer_bytes_per_sample || 520, fill: '#06b6d4' }
                          ]}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                            <XAxis dataKey="name" stroke="#64748b" fontSize={11} />
                            <YAxis stroke="#64748b" fontSize={11} />
                            <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#fff', fontSize: '12px' }} />
                            <Bar dataKey="bytes" name="Payload (Bytes)" radius={[6, 6, 0, 0]} />
                          </BarChart>
                        </ResponsiveContainer>
                      ) : null}
                    </div>
                  </div>

                  <div className="glass-panel p-5 space-y-3">
                    <div className="text-xs font-bold text-white uppercase tracking-wider">3. Inference Processing Breakdown (ms)</div>
                    <div className="h-64 w-full bg-slate-950/60 p-3 rounded-xl border border-gray-800">
                      {ResponsiveContainer ? (
                        <ResponsiveContainer width="100%" height="100%">
                          <BarChart data={[
                            { stage: 'Preprocess', ms: benchmark?.stage_breakdown.preprocessing_ms || 0.28, fill: '#6366f1' },
                            { stage: 'Features', ms: benchmark?.stage_breakdown.feature_extraction_ms || 0.65, fill: '#8b5cf6' },
                            { stage: 'Prediction', ms: benchmark?.stage_breakdown.model_prediction_ms || 0.92, fill: '#ec4899' }
                          ]}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                            <XAxis dataKey="stage" stroke="#64748b" fontSize={11} />
                            <YAxis stroke="#64748b" fontSize={11} />
                            <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#fff', fontSize: '12px' }} />
                            <Bar dataKey="ms" name="Stage Duration (ms)" radius={[6, 6, 0, 0]} />
                          </BarChart>
                        </ResponsiveContainer>
                      ) : null}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ROUTE 7: HISTORY LOG PAGE */}
            {currentRoute === '/history' && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold text-white">Telemetry & Prediction Audit Log</h2>
                <div className="glass-panel p-6 space-y-4">
                  <p className="text-xs text-gray-400">Audit trail of ingested vital sign events and model inferences.</p>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-slate-900 text-gray-400 border-b border-gray-800">
                        <tr>
                          <th className="p-3">Timestamp</th>
                          <th className="p-3">Patient Code</th>
                          <th className="p-3">HR (bpm)</th>
                          <th className="p-3">SpO₂ (%)</th>
                          <th className="p-3">Temp (°C)</th>
                          <th className="p-3">Prediction</th>
                          <th className="p-3">Risk Score</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-800">
                        {patients.map(p => {
                          const v = p.latest_vitals || {};
                          const pred = p.latest_prediction || {};
                          return (
                            <tr key={p.id} className="hover:bg-slate-900/50">
                              <td className="p-3 text-gray-400">{p.updated_at || 'Just now'}</td>
                              <td className="p-3 font-bold text-cyan-400">{p.patient_code}</td>
                              <td className="p-3 text-white">{v.heart_rate ? Math.round(v.heart_rate) : '--'}</td>
                              <td className="p-3 text-white">{v.spo2 ? Math.round(v.spo2) : '--'}</td>
                              <td className="p-3 text-white">{v.temperature || '--'}</td>
                              <td className="p-3 font-bold text-amber-400">{pred.prediction || 'NORMAL'}</td>
                              <td className="p-3 text-emerald-400">{pred.risk_score ? (pred.risk_score * 100).toFixed(0) + '%' : '5%'}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* ROUTE 8: SETTINGS PAGE */}
            {currentRoute === '/settings' && (
              <div className="space-y-6 max-w-2xl">
                <h2 className="text-xl font-bold text-white">Edge Node & Platform Settings</h2>
                <div className="glass-panel p-6 space-y-4 text-xs">
                  <div className="flex justify-between py-2 border-b border-gray-800">
                    <span className="text-gray-400">Connectivity Mode:</span>
                    <span className={`font-mono font-bold ${networkState === 'ONLINE' ? 'text-emerald-400' : (networkState === 'RECONNECTING' ? 'text-amber-400' : 'text-rose-400')}`}>
                      {networkState}
                    </span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-gray-800">
                    <span className="text-gray-400">Offline Queue Storage:</span>
                    <span className="font-mono text-cyan-400">SQLite (edge_ai/data/offline_queue.db)</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-gray-800">
                    <span className="text-gray-400">Edge Model Version:</span>
                    <span className="font-mono text-cyan-400">1.2.0-rf-edge (Random Forest)</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-gray-800">
                    <span className="text-gray-400">WebSocket Endpoint:</span>
                    <span className="font-mono text-white">/ws/monitoring</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-gray-800">
                    <span className="text-gray-400">Inference Latency Target:</span>
                    <span className="font-mono text-white">&lt; 10 ms</span>
                  </div>
                  <div className="flex justify-between py-2 border-b border-gray-800">
                    <span className="text-gray-400">Alert Engine Cooldown:</span>
                    <span className="font-mono text-white">60 seconds anti-spam window</span>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
