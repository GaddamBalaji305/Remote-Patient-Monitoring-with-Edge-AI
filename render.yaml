services:
  - type: web
    name: rpm-edge-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt && python scripts/seed_database.py
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: LOGIN_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CORS_ORIGINS
        value: "*"
